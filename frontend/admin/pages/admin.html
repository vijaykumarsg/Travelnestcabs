<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Nest Cabs – Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/admin/css/admin.css">

  <style>
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .filter-bar input,
    .filter-bar button {
      padding: 8px 10px;
      font-size: 14px;
    }
    .filter-bar button {
      background: #0a3d91;
      color: #fff;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- ================= LOGIN PAGE ================= -->
<div id="loginPage" class="login-page">
  <div class="login-left">
    <h1>Welcome to <br><span>Travel Nest Cabs</span></h1>
    <p>Reliable, comfortable, and affordable cab services.</p>
  </div>

  <div class="login-right">
    <div class="login-card">
      <h2>Admin Login</h2>

      <input type="text" id="adminUsername" placeholder="Username">
      <input type="password" id="adminPassword" placeholder="Password">

      <button type="button" onclick="adminLogin()">Login</button>
      <p id="loginError" class="error-text"></p>
    </div>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard" style="display:none">
  <header>
    <h1>🚖 Travel Nest Cabs – Admin Panel</h1>
    <button onclick="logout()">Logout</button>
  </header>

  <section>
    <h2>Bookings</h2>

    <div class="filter-bar">
      <input type="text" id="searchBookingNo" placeholder="Search Booking No" oninput="applyFilters()">
      <input type="date" id="filterDate" onchange="applyFilters()">
      <button onclick="exportToExcel()">📥 Export to Excel</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Booking No</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Pickup</th>
          <th>Drop</th>
          <th>Car</th>
          <th>Price</th>
          <th>Booked At</th>
          <th>Status</th>
          <th>Invoice</th>
          <th>WhatsApp</th>
        </tr>
      </thead>
      <tbody id="bookingTable">
        <tr><td colspan="12">Loading...</td></tr>
      </tbody>
    </table>
  </section>
</div>


<script src="/admin/js/script.js"></script>
</body>
</html>
