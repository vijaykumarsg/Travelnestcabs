<!DOCTYPE html>
<html>
<head>
<title>Driver Dashboard - TravelNestCabs</title>
<link rel="stylesheet" href="/driver/css/driver_dashboard.css">

<style>
.top{
 display:flex;
 justify-content:space-between;
 margin-bottom:10px;
}

.card{
 background:#fff;
 padding:12px;
 margin:8px 0;
 border-radius:6px;
 box-shadow:0 0 5px #ddd;
}

.status{
 padding:4px 8px;
 border-radius:4px;
 font-size:12px;
}

.pending{background:#fff3cd;}
.approved{background:#d4edda;}
</style>

</head>

<body>

<div class="container">

<div class="reg-card" style="width:600px">

<div class="top">
<h3>Welcome, <span id="driverName"></span></h3>
<button class="btn" style="width:120px" onclick="logout()">Logout</button>

</div>

<div class="card">
<b>Verification Status:</b>
<span id="driverStatus" class="status">Loading...</span>
</div>

<!-- ✅ Wallet Balance -->
<div class="card">
<b>Wallet Balance:</b>
₹ <span id="walletBalance">0</span>
</div>

<h4>Assigned Trips</h4>

<!-- ✅ Dynamic trips will load here -->
<div id="tripList"></div>

</div>
</div>



<script src="/driver/js/driver.js"></script>

</body>
</html>
