<!DOCTYPE html>
<html>
<head>
<title>Verify Drivers - TravelNestCabs</title>
<link rel="stylesheet" href="/frontend/driver/css/driver_ver.css">

<style>
.table{
 width:100%;
 border-collapse:collapse;
}

.table th, .table td{
 padding:8px;
 border:1px solid #ddd;
 font-size:13px;
}

.action button{
 margin:2px;
 padding:5px;
}
</style>

</head>

<body>

<div class="container">

<div class="reg-card" style="width:800px">

<h2>Driver Verification</h2>

<table class="table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Phone</th>
      <th>DL No</th>
      <th>Vehicle</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="driverTable">
    <!-- drivers will be inserted here by JS -->
  </tbody>
</table>


</div>
</div>


<script src="/frontend/driver/js/driver.js"></script>

</body>
</html>
