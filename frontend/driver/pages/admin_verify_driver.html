<!DOCTYPE html>
<html>
<head>
<title>Verify Drivers - TravelNestCabs</title>
<link rel="stylesheet" href="../css/driver_ver.css">

<style>
.table{
 width:100%;
 border-collapse:collapse;
}

.table th, .table td{
 padding:8px;
 border:1px solid #ddd;
 font-size:13px;
}

.action button{
 margin:2px;
 padding:5px;
}
</style>

</head>

<body>

<div class="container">

<div class="reg-card" style="width:800px">

<h2>Driver Verification</h2>

<table class="table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Phone</th>
      <th>DL No</th>
      <th>Vehicle</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody id="driverTable">
    <!-- drivers will be inserted here by JS -->
  </tbody>
</table>


</div>
</div>


<script>
const API = "http://127.0.0.1:9000";

async function loadDrivers() {
  const res = await fetch(`${API}/api/driver/admin/drivers`);
  const drivers = await res.json();

  const table = document.getElementById("driverTable");
  table.innerHTML = "";

  drivers.forEach(d => {
    table.innerHTML += `
      <tr>
        <td>${d.name}</td>
        <td>${d.phone}</td>
        <td>${d.licence_no}</td>
        <td>${d.vehicle_no}</td>
        <td>${d.status}</td>
        <td class="action">
          <button class="btn" style="width:80px;background:green"
            onclick="approve(${d.id})">Approve</button>

          <button class="btn" style="width:70px;background:red"
            onclick="reject(${d.id})">Reject</button>
        </td>
      </tr>
    `;
  });
}

async function approve(id) {
  await fetch(`${API}/api/driver/admin/driver/${id}/approve`, {
    method: "PUT"
  });
  loadDrivers();
}

async function reject(id) {
  await fetch(`${API}/api/driver/admin/driver/${id}/reject`, {
    method: "PUT"
  });
  loadDrivers();
}

loadDrivers();
</script>

</body>
</html>
