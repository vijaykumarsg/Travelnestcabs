<!DOCTYPE html>
<html>
<head>
<title>Driver Login | Travel Nest Cabs</title>
<meta name="description" content="Driver login page for Travel Nest Cabs. Registered drivers can sign in to access trips and earnings.">

<link rel="stylesheet" href="/driver/css/driver_login.css">
</head>

<body>
<h1>Driver Login – Travel Nest Cabs</h1>

<p class="sr-only">
Registered drivers can login here to access their dashboard,
manage trips, and view earnings.
</p>


<div class="container">

<div class="reg-card">

<h2>Driver Login</h2>
<p class="subtitle">Access your driver account</p>

<form>

<label>Phone Number</label>
<input type="text" placeholder="Enter phone">

<label>Password</label>
<input type="password" placeholder="Password">

<button class="btn">Login</button>

<div class="footer">
New driver? <a href="/driver/pages/driver_register.html">Register</a>
</div>

</form>

</div>
</div>
<script src="/driver/js/driver.js"></script>
</body>
</html>
